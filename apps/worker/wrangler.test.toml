# 测试专用配置（@cloudflare/vitest-pool-workers 消费）
# 与生产 wrangler.toml 一致，但去掉 miniflare 无法本地模拟的 send_email binding，
# 以及不需要的 routes/custom_domain。集成测试不发外部邮件，不调 env.email。
name = "hpc-cloud-mail"
main = "src/index.ts"
compatibility_date = "2025-06-04"

[vars]
domain = [
  "hpc.email",
  "happyclaw.cc",
  "riba2534.cn",
  "tiktok-row.cn",
  "option.red",
  "claude-router.cc",
]
ai_model = "@cf/meta/llama-3.1-8b-instruct"

[[d1_databases]]
binding = "db"
database_name = "hpc-cloud-mail-db"
database_id = "4888de56-5d04-4ccf-b0ab-44d309306d23"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "kv"
id = "740790d8a32f4286833f17940358f1bb"

[[r2_buckets]]
binding = "r2"
bucket_name = "hpc-cloud-mail-r2"

[ai]
binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/v1/*"]
