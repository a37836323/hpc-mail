name = "hpc-cloud-mail"
main = "src/index.ts"
compatibility_date = "2025-06-04"
# account_id 不入库：wrangler 从 CLOUDFLARE_ACCOUNT_ID 环境变量读取（CI 由 GitHub Variables 提供）
workers_dev = false

# 双下划线占位符由 CI 在部署前注入真实值（deploy.yml「注入 Cloudflare 资源配置」步骤）；
# 本地 wrangler dev 跑本地模拟，不需要真实 ID
routes = [
  { pattern = "__CUSTOM_DOMAIN__", custom_domain = true },
]

[observability]
enabled = true

[triggers]
crons = ["0 16 * * *"]

[vars]
# 系统域名不再写死在 vars，改由 settings.domains.list（管理端维护）；见 services/domain.ts
ai_model = "@cf/meta/llama-3.1-8b-instruct"

[[d1_databases]]
binding = "db"
database_name = "hpc-cloud-mail-db"
database_id = "__D1_DATABASE_ID__"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "kv"
id = "__KV_NAMESPACE_ID__"

[[r2_buckets]]
binding = "r2"
bucket_name = "hpc-cloud-mail-r2"

# Cloudflare 原生发信（send_email binding）
[[send_email]]
name = "email"

[ai]
binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/v1/*", "/skill.md", "/assets/*"]

# Secrets（wrangler secret put）：
#   jwt_secret              JWT 签名密钥（必需）
