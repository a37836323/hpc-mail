name = "${NAME}"
main = "src/index.js"
compatibility_date = "2025-06-04"

[observability]
enabled = true

[[routes]]
pattern = "${CUSTOM_DOMAIN}"
custom_domain = true

[[d1_databases]]
binding = "db"
database_name = "hpc-cloud-mail-db"
database_id = "${D1_DATABASE_ID}"

[[kv_namespaces]]
binding = "kv"
id = "${KV_NAMESPACE_ID}"

[[r2_buckets]]
binding = "r2"
bucket_name = "${R2_BUCKET_NAME}"

[ai]
binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 16 * * *"]

[vars]
ai_model = "${AI_MODEL}"
analysis_cache = "${ANALYSIS_CACHE}"
domain = "${DOMAIN}"
project_link = "${PROJECT_LINK}"

[build]
command = "pnpm --prefix ../mail-react install --frozen-lockfile && pnpm --prefix ../mail-react run build && rm -rf ./dist && cp -R ../mail-react/dist ./dist && ! find ./dist -type f -name '*.map' -print -quit | grep -q ."
