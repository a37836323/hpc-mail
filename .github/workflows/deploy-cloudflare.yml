name: Deploy HPC Mail to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-cloudflare.yml"
      - "mail-worker/**"
      - "mail-vue/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hpc-mail-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Test, migrate, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NAME: ${{ vars.NAME }}
      CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
      DOMAIN: ${{ vars.DOMAIN }}
      ADMIN: ${{ vars.ADMIN }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
      R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
      PROJECT_LINK: ${{ vars.PROJECT_LINK || 'false' }}
      AI_MODEL: ${{ vars.AI_MODEL || '@cf/meta/llama-3.1-8b-instruct' }}
      CF_EMAIL: ${{ vars.CF_EMAIL || 'false' }}
      ANALYSIS_CACHE: ${{ vars.ANALYSIS_CACHE || 'false' }}
      LINUXDO_CLIENT_ID: ${{ vars.LINUXDO_CLIENT_ID }}
      LINUXDO_CALLBACK_URL: ${{ vars.LINUXDO_CALLBACK_URL }}
      LINUXDO_SWITCH: ${{ vars.LINUXDO_SWITCH || 'false' }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      LINUXDO_CLIENT_SECRET: ${{ secrets.LINUXDO_CLIENT_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: |
            mail-worker/pnpm-lock.yaml
            mail-vue/pnpm-lock.yaml

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(NAME CUSTOM_DOMAIN DOMAIN ADMIN D1_DATABASE_ID KV_NAMESPACE_ID R2_BUCKET_NAME CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN JWT_SECRET)
          for key in "${required[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "::error::$key is not configured"
              exit 1
            fi
          done
          if ! jq -e 'type == "array" and length > 0 and all(.[]; type == "string" and length > 0)' <<< "$DOMAIN" >/dev/null; then
            echo "::error::DOMAIN must be a non-empty JSON array of domain names"
            exit 1
          fi
          if ! [[ "$JWT_SECRET" =~ ^[A-Za-z0-9_-]{43,}$ ]]; then
            echo "::error::JWT_SECRET must be a URL-safe random value of at least 43 characters"
            exit 1
          fi
          if [ "${LINUXDO_SWITCH,,}" = "true" ] && { [ -z "${LINUXDO_CLIENT_ID:-}" ] || [ -z "${LINUXDO_CLIENT_SECRET:-}" ] || [ -z "${LINUXDO_CALLBACK_URL:-}" ]; }; then
            echo "::error::LinuxDo OAuth is enabled but its credentials are incomplete"
            exit 1
          fi
          echo "::add-mask::$JWT_SECRET"
          if [ -n "${LINUXDO_CLIENT_SECRET:-}" ]; then echo "::add-mask::$LINUXDO_CLIENT_SECRET"; fi

      - name: Install Worker dependencies
        working-directory: mail-worker
        run: pnpm install --frozen-lockfile

      - name: Install frontend dependencies
        working-directory: mail-vue
        run: pnpm install --frozen-lockfile

      - name: Run Worker tests
        working-directory: mail-worker
        run: pnpm run test:unit

      - name: Run frontend tests
        working-directory: mail-vue
        run: pnpm test

      - name: Audit production dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir mail-worker audit --prod
          pnpm --dir mail-vue audit --prod

      - name: Build frontend
        working-directory: mail-vue
        run: pnpm run build

      - name: Render production Wrangler configuration
        working-directory: mail-worker
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'wrangler-action.toml'
          let config = fs.readFileSync(path, 'utf8')
          const stringValues = {
            NAME: process.env.NAME,
            CUSTOM_DOMAIN: process.env.CUSTOM_DOMAIN,
            D1_DATABASE_ID: process.env.D1_DATABASE_ID,
            KV_NAMESPACE_ID: process.env.KV_NAMESPACE_ID,
            R2_BUCKET_NAME: process.env.R2_BUCKET_NAME,
            AI_MODEL: process.env.AI_MODEL,
            ADMIN: process.env.ADMIN,
            LINUXDO_CLIENT_ID: process.env.LINUXDO_CLIENT_ID || '',
            LINUXDO_CALLBACK_URL: process.env.LINUXDO_CALLBACK_URL || '',
          }
          for (const [key, value] of Object.entries(stringValues)) {
            config = config.replaceAll(`"\${${key}}"`, JSON.stringify(value))
          }
          const domains = JSON.parse(process.env.DOMAIN)
          config = config.replace('"${DOMAIN}"', JSON.stringify(domains))
          for (const key of ['PROJECT_LINK', 'ANALYSIS_CACHE', 'LINUXDO_SWITCH']) {
            const value = String(process.env[key] || 'false').toLowerCase() === 'true'
            config = config.replace(`"\${${key}}"`, String(value))
          }
          if (!process.env.LINUXDO_CLIENT_ID || String(process.env.LINUXDO_SWITCH).toLowerCase() !== 'true') {
            config = config.replace(/^linuxdo_client_id = .*\nlinuxdo_callback_url = .*\nlinuxdo_switch = .*\n?/m, '')
          }
          if (String(process.env.CF_EMAIL).toLowerCase() === 'true') {
            config += '\n[[send_email]]\nname = "email"\n'
          }
          if (/\$\{[A-Z0-9_]+\}/.test(config)) throw new Error('Unresolved Wrangler template variable')
          fs.writeFileSync(path, config)
          NODE
          pnpm exec wrangler deploy --dry-run --config wrangler-action.toml --outdir /tmp/hpc-mail-dry-run

      - name: Deploy Worker and assets
        working-directory: mail-worker
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler deploy --config wrangler-action.toml

      - name: Synchronize Worker secrets
        working-directory: mail-worker
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$JWT_SECRET" | pnpm exec wrangler secret put jwt_secret --config wrangler-action.toml
          if [ "${LINUXDO_SWITCH,,}" = "true" ]; then
            printf '%s' "$LINUXDO_CLIENT_SECRET" | pnpm exec wrangler secret put linuxdo_client_secret --config wrangler-action.toml
          fi

      - name: Run idempotent database migration
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://${CUSTOM_DOMAIN}/api/init/${JWT_SECRET}"
          for attempt in {1..10}; do
            response=$(curl --silent --show-error --location --max-time 30 "$endpoint" || true)
            if [ "$response" = "success" ]; then
              echo "Database migration completed"
              exit 0
            fi
            echo "Migration endpoint not ready (attempt $attempt/10)"
            sleep 6
          done
          echo "::error::Database migration did not complete"
          exit 1

      - name: Verify production health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 30 "https://${CUSTOM_DOMAIN}/" >/dev/null
          curl --fail --silent --show-error --location --max-time 30 "https://${CUSTOM_DOMAIN}/api/setting/websiteConfig" | jq -e '.code == 200' >/dev/null
          echo "Production health checks passed"
