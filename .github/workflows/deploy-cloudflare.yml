name: Deploy HPC Mail to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-cloudflare.yml"
      - "mail-worker/**"
      - "mail-react/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hpc-mail-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Test, deploy, and initialize schema
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NAME: ${{ vars.NAME }}
      CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
      DOMAIN: ${{ vars.DOMAIN }}
      ADMIN_USERNAME: ${{ vars.ADMIN_USERNAME }}
      REBUILD_DATABASE: ${{ vars.REBUILD_DATABASE || 'false' }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
      R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
      PROJECT_LINK: ${{ vars.PROJECT_LINK || 'false' }}
      AI_MODEL: ${{ vars.AI_MODEL || '@cf/meta/llama-3.1-8b-instruct' }}
      CF_EMAIL: ${{ vars.CF_EMAIL || 'false' }}
      ANALYSIS_CACHE: ${{ vars.ANALYSIS_CACHE || 'false' }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      INIT_SECRET: ${{ secrets.INIT_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: |
            mail-worker/pnpm-lock.yaml
            mail-react/pnpm-lock.yaml

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(NAME CUSTOM_DOMAIN DOMAIN ADMIN_USERNAME D1_DATABASE_ID KV_NAMESPACE_ID R2_BUCKET_NAME CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN JWT_SECRET ADMIN_PASSWORD INIT_SECRET)
          for key in "${required[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "::error::$key is not configured"
              exit 1
            fi
          done
          if ! jq -e 'type == "array" and length > 0 and all(.[]; type == "string" and length > 0)' <<< "$DOMAIN" >/dev/null; then
            echo "::error::DOMAIN must be a non-empty JSON array of domain names"
            exit 1
          fi
          if ! [[ "$JWT_SECRET" =~ ^[A-Za-z0-9_-]{43,}$ ]]; then
            echo "::error::JWT_SECRET must be a URL-safe random value of at least 43 characters"
            exit 1
          fi
          if [ "${#INIT_SECRET}" -lt 32 ]; then
            echo "::error::INIT_SECRET must contain at least 32 characters"
            exit 1
          fi
          if [ "${#ADMIN_PASSWORD}" -lt 12 ] || [ "${#ADMIN_PASSWORD}" -gt 128 ]; then
            echo "::error::ADMIN_PASSWORD must contain 12 to 128 characters"
            exit 1
          fi
          if ! [[ "$ADMIN_USERNAME" =~ ^[A-Za-z0-9._-]{3,32}$ ]] || [[ "$ADMIN_USERNAME" == .* ]] || [[ "$ADMIN_USERNAME" == *. ]] || [[ "$ADMIN_USERNAME" == *..* ]]; then
            echo "::error::ADMIN_USERNAME must satisfy the HPC Mail username rules"
            exit 1
          fi
          if [[ "${REBUILD_DATABASE,,}" != "true" && "${REBUILD_DATABASE,,}" != "false" ]]; then
            echo "::error::REBUILD_DATABASE must be true or false"
            exit 1
          fi
          echo "::add-mask::$JWT_SECRET"
          echo "::add-mask::$ADMIN_PASSWORD"
          echo "::add-mask::$INIT_SECRET"

      - name: Install Worker dependencies
        working-directory: mail-worker
        run: pnpm install --frozen-lockfile

      - name: Install frontend dependencies
        working-directory: mail-react
        run: pnpm install --frozen-lockfile

      - name: Run Worker tests
        working-directory: mail-worker
        run: pnpm run test:unit

      - name: Run frontend tests
        working-directory: mail-react
        run: pnpm test

      - name: Type-check frontend
        working-directory: mail-react
        run: pnpm run typecheck

      - name: Audit production dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir mail-worker audit --prod
          pnpm --dir mail-react audit --prod

      - name: Build frontend
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir mail-react run build
          rm -rf mail-worker/dist
          cp -R mail-react/dist mail-worker/dist
          if find mail-worker/dist -type f -name '*.map' -print -quit | grep -q .; then
            echo "::error::Production frontend must not contain source maps"
            exit 1
          fi

      - name: Render production Wrangler configuration
        working-directory: mail-worker
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'wrangler-action.toml'
          let config = fs.readFileSync(path, 'utf8')
          const stringValues = {
            NAME: process.env.NAME,
            CUSTOM_DOMAIN: process.env.CUSTOM_DOMAIN,
            D1_DATABASE_ID: process.env.D1_DATABASE_ID,
            KV_NAMESPACE_ID: process.env.KV_NAMESPACE_ID,
            R2_BUCKET_NAME: process.env.R2_BUCKET_NAME,
            AI_MODEL: process.env.AI_MODEL,
          }
          for (const [key, value] of Object.entries(stringValues)) {
            config = config.replaceAll(`"\${${key}}"`, JSON.stringify(value))
          }
          const domains = JSON.parse(process.env.DOMAIN)
          config = config.replace('"${DOMAIN}"', JSON.stringify(domains))
          for (const key of ['PROJECT_LINK', 'ANALYSIS_CACHE']) {
            const value = String(process.env[key] || 'false').toLowerCase() === 'true'
            config = config.replace(`"\${${key}}"`, String(value))
          }
          if (String(process.env.CF_EMAIL).toLowerCase() === 'true') {
            config += '\n[[send_email]]\nname = "email"\n'
          }
          if (/\$\{[A-Z0-9_]+\}/.test(config)) throw new Error('Unresolved Wrangler template variable')
          fs.writeFileSync(path, config)
          NODE
          pnpm exec wrangler deploy --dry-run --config wrangler-action.toml --outdir /tmp/hpc-mail-dry-run

      - name: Deploy Worker and assets
        working-directory: mail-worker
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler deploy --config wrangler-action.toml

      - name: Synchronize Worker secrets
        working-directory: mail-worker
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$JWT_SECRET" | pnpm exec wrangler secret put jwt_secret --config wrangler-action.toml
          printf '%s' "$INIT_SECRET" | pnpm exec wrangler secret put init_secret --config wrangler-action.toml

      - name: Initialize versioned database schema
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://${CUSTOM_DOMAIN}/api/init"
          expected_schema_version=$(sed -n "s/^const SCHEMA_VERSION = '\([^']*\)';$/\1/p" mail-worker/src/init/init.js)
          if [ -z "$expected_schema_version" ]; then
            echo "::error::Unable to determine the expected database schema version"
            exit 1
          fi
          rebuild=false
          if [ "${REBUILD_DATABASE,,}" = "true" ]; then rebuild=true; fi
          payload=$(jq -nc \
            --arg adminUsername "$ADMIN_USERNAME" \
            --arg adminPassword "$ADMIN_PASSWORD" \
            --argjson rebuild "$rebuild" \
            '{adminUsername: $adminUsername, adminPassword: $adminPassword, rebuild: $rebuild}')
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          for attempt in {1..10}; do
            : > "$response_file"
            status=$(curl --silent --show-error --max-time 30 \
              --output "$response_file" --write-out '%{http_code}' \
              --request POST "$endpoint" \
              --header "Authorization: Bearer $INIT_SECRET" \
              --header 'Content-Type: application/json' \
              --data "$payload" || true)
            if [[ "$status" =~ ^2[0-9][0-9]$ ]] && jq -e \
              --arg expected "$expected_schema_version" \
              '.code == 200 and .data.schemaVersion == $expected' \
              "$response_file" >/dev/null 2>&1; then
              echo "Database schema v${expected_schema_version} initialized"
              exit 0
            fi
            detail=$(jq -r '
              if type == "object" then
                "code=\(.code // "unknown"), schema=\(.data.schemaVersion // "unknown"), message=\(.message // "unknown")"
              else
                "non-JSON response"
              end
              | gsub("[\\r\\n]+"; " ")
              | .[0:500]
            ' "$response_file" 2>/dev/null || printf '%s' 'unreadable response')
            echo "Schema initialization endpoint not ready (attempt $attempt/10, HTTP ${status:-000}, $detail)"
            sleep 6
          done
          echo "::error::Versioned database schema initialization did not complete"
          exit 1

      - name: Verify production health
        shell: bash
        run: |
          set -euo pipefail
          login_response=$(mktemp)
          user_response=$(mktemp)
          legacy_login_response=$(mktemp)
          api_config_response=$(mktemp)
          public_api_response=$(mktemp)
          logout_response=$(mktemp)
          token=''
          cleanup() {
            if [ -n "$token" ]; then
              curl --silent --max-time 15 --request DELETE \
                "https://${CUSTOM_DOMAIN}/api/logout" \
                --header "Authorization: $token" >/dev/null || true
            fi
            rm -f "$login_response" "$user_response" "$legacy_login_response" "$api_config_response" "$public_api_response" "$logout_response"
          }
          trap cleanup EXIT
          curl --fail --silent --show-error --location --max-time 30 "https://${CUSTOM_DOMAIN}/" >/dev/null
          curl --fail --silent --show-error --location --max-time 30 "https://${CUSTOM_DOMAIN}/api/setting/websiteConfig" | jq -e '.code == 200' >/dev/null

          login_payload=$(jq -nc --arg username "$ADMIN_USERNAME" --arg password "$ADMIN_PASSWORD" '{username: $username, password: $password}')
          login_status=$(curl --silent --show-error --max-time 30 \
            --output "$login_response" --write-out '%{http_code}' \
            --request POST "https://${CUSTOM_DOMAIN}/api/login" \
            --header 'Content-Type: application/json' \
            --data "$login_payload")
          if ! [[ "$login_status" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::Production administrator login failed with HTTP $login_status"
            exit 1
          fi
          token=$(jq -er 'select(.code == 200) | .data.token | strings | select(length > 0)' "$login_response")

          user_status=$(curl --silent --show-error --max-time 30 \
            --output "$user_response" --write-out '%{http_code}' \
            "https://${CUSTOM_DOMAIN}/api/my/loginUserInfo" \
            --header "Authorization: $token")
          if ! [[ "$user_status" =~ ^2[0-9][0-9]$ ]] || ! jq -e \
            --arg username "$ADMIN_USERNAME" \
            '.code == 200
              and .data.username == $username
              and .data.role.key == "admin"
              and (.data | has("defaultAccount") | not)
              and (.data | has("email") | not)
              and (.data | has("account") | not)
              and (.data | has("legacyEmail") | not)' \
            "$user_response" >/dev/null; then
            echo "::error::Authenticated production health check failed"
            exit 1
          fi

          curl --fail --silent --show-error --max-time 30 \
            "https://${CUSTOM_DOMAIN}/api/email/list?accountId=0&emailId=0&timeSort=0&size=20&type=0" \
            --header "Authorization: $token" \
            | jq -e '.code == 200 and (.data.list | type == "array")' >/dev/null
          curl --fail --silent --show-error --max-time 30 \
            "https://${CUSTOM_DOMAIN}/api/allEmail/list?emailId=0&timeSort=0&size=20&type=all" \
            --header "Authorization: $token" \
            | jq -e '.code == 200 and (.data.list | type == "array")' >/dev/null

          curl --fail --silent --show-error --max-time 30 \
            "https://${CUSTOM_DOMAIN}/api/setting/query" \
            --header "Authorization: $token" \
            | jq -e '.code == 200
              and (.data.feishuWebhookConfigured | type == "boolean")
              and (.data.feishuBotSecretConfigured | type == "boolean")' >/dev/null

          api_config_status=$(curl --silent --show-error --max-time 30 \
            --output "$api_config_response" --write-out '%{http_code}' \
            "https://${CUSTOM_DOMAIN}/api/apiKey/config" \
            --header "Authorization: $token")
          if ! [[ "$api_config_status" =~ ^2[0-9][0-9]$ ]] || ! jq -e \
            '.code == 200 and (.data.enabled | type == "boolean")' \
            "$api_config_response" >/dev/null; then
            detail=$(jq -r '"code=\(.code // "unknown"), message=\(.message // "unknown")" | .[0:500]' "$api_config_response" 2>/dev/null || printf '%s' 'unreadable response')
            echo "::error::Production API control health check failed with HTTP $api_config_status ($detail)"
            exit 1
          fi

          public_api_status=$(curl --silent --show-error --max-time 30 \
            --output "$public_api_response" --write-out '%{http_code}' \
            "https://${CUSTOM_DOMAIN}/api/v1/status")
          if [[ "$public_api_status" != "401" && "$public_api_status" != "503" ]] || ! jq -e \
            '(.error.code == 401 or .error.code == 503) and (.requestId | type == "string" and length > 0)' \
            "$public_api_response" >/dev/null; then
            echo "::error::Production public API authentication boundary failed with HTTP $public_api_status"
            exit 1
          fi

          legacy_login_payload=$(jq -nc --arg username "legacy@example.invalid" --arg password "$ADMIN_PASSWORD" '{username: $username, password: $password}')
          curl --silent --show-error --max-time 30 \
            --output "$legacy_login_response" \
            --request POST "https://${CUSTOM_DOMAIN}/api/login" \
            --header 'Content-Type: application/json' \
            --data "$legacy_login_payload"
          if ! jq -e '.code == 401 and (.data | not)' "$legacy_login_response" >/dev/null; then
            echo "::error::Legacy email-address login is still accepted"
            exit 1
          fi
          unset legacy_login_payload

          logout_status=$(curl --silent --show-error --max-time 30 \
            --output "$logout_response" --write-out '%{http_code}' \
            --request DELETE "https://${CUSTOM_DOMAIN}/api/logout" \
            --header "Authorization: $token")
          if ! [[ "$logout_status" =~ ^2[0-9][0-9]$ ]] || ! jq -e '.code == 200' "$logout_response" >/dev/null; then
            echo "::error::Production logout health check failed"
            exit 1
          fi
          token=''
          unset login_payload
          echo "Production health checks passed"
