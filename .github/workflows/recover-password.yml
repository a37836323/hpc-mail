name: One-time password recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    name: Replace an explicitly configured password hash
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      RECOVERY_USERNAME: ${{ secrets.RECOVERY_USERNAME }}
      RECOVERY_PASSWORD_HASH: ${{ secrets.RECOVERY_PASSWORD_HASH }}
      RECOVERY_PASSWORD_SALT: ${{ secrets.RECOVERY_PASSWORD_SALT }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: mail-worker/pnpm-lock.yaml

      - name: Install Worker dependencies
        working-directory: mail-worker
        run: pnpm install --frozen-lockfile

      - name: Validate recovery values
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RECOVERY_USERNAME" =~ ^[A-Za-z0-9_-]{3,32}$ ]]
          [[ "$RECOVERY_PASSWORD_HASH" =~ ^pbkdf2-sha256\$100000\$[A-Za-z0-9_-]+\$[A-Za-z0-9_-]+$ ]]
          [[ "$RECOVERY_PASSWORD_SALT" =~ ^[A-Za-z0-9_-]+$ ]]
          echo "::add-mask::$RECOVERY_USERNAME"
          echo "::add-mask::$RECOVERY_PASSWORD_HASH"
          echo "::add-mask::$RECOVERY_PASSWORD_SALT"

      - name: Replace password hash in production D1
        working-directory: mail-worker
        shell: bash
        run: |
          set -euo pipefail
          sql="UPDATE user SET password = '${RECOVERY_PASSWORD_HASH}', salt = '${RECOVERY_PASSWORD_SALT}' WHERE username = '${RECOVERY_USERNAME}' COLLATE NOCASE; SELECT changes() AS updated_users;"
          pnpm exec wrangler d1 execute hpc-cloud-mail-db --remote --config wrangler.toml --command "$sql"
